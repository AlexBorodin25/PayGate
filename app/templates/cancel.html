<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout Cancelled | PayGate</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <h1 class="logo">PayGate</h1>
        <nav class="nav-space" aria-label="Main navigation">
            <a href="/">Products</a>
            <a href="/orders-ui">Orders</a>
        </nav>
    </div>
</header>

<main>
    <section class="status-panel">
        <p class="status-eyebrow">Checkout cancelled</p>
        <h2 id="status-title">Checkout was not completed</h2>
        <p id="status-message">
            You returned from Stripe before completing payment. If no payment is
            confirmed, the reserved stock will be released automatically.
        </p>

        <a class="link-button" href="/">Back to products</a>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        PayGate checkout demo. Use card number 4242 4242 4242 4242 at checkout.
    </div>
</footer>

<script>
    const sessionId = "{{ session_id or '' }}";
    const title = document.getElementById("status-title");
    const message = document.getElementById("status-message");
    let poller = null;

    function stopPolling() {
        if (poller !== null) {
            clearInterval(poller);
            poller = null;
        }
    }

    async function refreshOrderStatus() {
        if (!sessionId) {
            title.textContent = "Checkout was cancelled";
            message.textContent = "No checkout session id was provided.";
            stopPolling();
            return;
        }

        const response = await fetch(`/checkout-sessions/${sessionId}/status`);

        if (!response.ok) {
            title.textContent = "Checkout was cancelled";
            message.textContent =
                "We could not load this checkout status yet.";
            stopPolling();
            return;
        }

        const order = await response.json();

        if (
            order.status === "paid" &&
            order.fulfillment_status === "fulfilled"
        ) {
            title.textContent = "Payment complete";
            message.textContent = "Your order has been fulfilled.";
            stopPolling();
            return;
        }

        if (
            order.status === "paid" &&
            order.fulfillment_status === "payment_review"
        ) {
            title.textContent = "Payment received";
            message.textContent =
                "Your payment was received, but this order needs manual review.";
            stopPolling();
            return;
        }

        if (order.status === "checkout_failed") {
            title.textContent = "Checkout was not completed";
            message.textContent =
                "This checkout session was cancelled or expired.";
            stopPolling();
            return;
        }

        if (order.status === "paid") {
            title.textContent = "Payment confirmed";
            message.textContent = "Your order is being fulfilled.";
            return;
        }

        if (order.status === "pending") {
            title.textContent = "Checkout was cancelled";
            message.textContent =
                "No payment has been confirmed. Reserved stock will be released automatically if the checkout expires.";
            stopPolling();
            return;
        }

        title.textContent = "Checkout was cancelled";
        message.textContent =
            "No payment has been confirmed. Reserved stock will be released automatically if the checkout expires.";
        stopPolling();
    }

    refreshOrderStatus();
    poller = setInterval(refreshOrderStatus, 3000);
</script>
</body>
</html>
