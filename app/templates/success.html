<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Status | PayGate</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <h1 class="logo">PayGate</h1>
        <nav class="nav-space" aria-label="Navigation to be added"></nav>
    </div>
</header>

<main>
    <section class="status-panel">
        <p class="status-eyebrow">Checkout returned</p>
        <h2 id="status-title">Payment confirmation is being processed</h2>
        <p id="status-message">
            Stripe redirected you back to PayGate. Payment and fulfillment are
            confirmed securely in the background.
        </p>

        <a class="link-button" href="/">Back to products</a>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        PayGate checkout demo. Use card number 4242 4242 4242 4242 at checkout.
    </div>
</footer>

<script>
    const orderId = "{{ order_id or '' }}";
    const title = document.getElementById("status-title");
    const message = document.getElementById("status-message");

    async function refreshOrderStatus() {
        if (!orderId) {
            title.textContent = "Checkout returned";
            message.textContent = "No order id was provided.";
            return;
        }

        const response = await fetch(`/orders/${orderId}/status`);

        if (!response.ok) {
            title.textContent = "Order status unavailable";
            message.textContent = "We could not load this order status.";
            return;
        }

        const order = await response.json();

        if (
            order.status === "paid" &&
            order.fulfillment_status === "fulfilled"
        ) {
            title.textContent = "Payment complete";
            message.textContent = "Your order has been fulfilled.";
            return;
        }

        if (
            order.status === "paid" &&
            order.fulfillment_status === "payment_review"
        ) {
            title.textContent = "Payment received";
            message.textContent =
                "Your payment was received, but this order needs manual review.";
            return;
        }

        if (order.status === "paid") {
            title.textContent = "Payment confirmed";
            message.textContent = "Your order is being fulfilled.";
            return;
        }

        if (order.status === "checkout_failed") {
            title.textContent = "Checkout was not completed";
            message.textContent =
                "This checkout session was not completed successfully.";
            return;
        }

        title.textContent = "Payment confirmation is being processed";
        message.textContent =
            "Stripe redirected you back to PayGate. Payment and fulfillment are confirmed securely in the background.";
    }

    refreshOrderStatus();
    setInterval(refreshOrderStatus, 3000);
</script>
</body>
</html>
