<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | PayGate</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <h1 class="logo">PayGate</h1>
        <nav class="nav-space" aria-label="Main navigation">
            <a href="/">Products</a>
            <a href="/orders-ui">Orders</a>
        </nav>
    </div>
</header>

<main>
    <section class="orders-toolbar">
        <div>
            <p class="status-eyebrow">Operator view</p>
            <h2 class="page-title">Orders</h2>
        </div>

        <div class="orders-controls">
            <input id="api-key" type="password" placeholder="Orders API Key">

            <select id="status-filter">
                <option value="">Any payment status</option>
                <option value="pending">Pending</option>
                <option value="paid">Paid</option>
                <option value="checkout_failed">Checkout failed</option>
            </select>

            <select id="fulfillment-filter">
                <option value="">Any fulfillment status</option>
                <option value="pending">Pending</option>
                <option value="processing">Processing</option>
                <option value="fulfilled">Fulfilled</option>
                <option value="payment_review">Payment review</option>
                <option value="failed">Failed</option>
            </select>

            <input id="product-filter" type="text" placeholder="Product ID">

            <button type="button" id="needs-attention-failed">
                Needs attention: Failed
            </button>
            <button type="button" id="needs-attention-review">
                Needs attention: Review
            </button>
            <button type="button" id="load-orders">Load</button>
        </div>
    </section>

    <section class="orders-summary" id="orders-summary">
        Enter the orders API key to show orders.
    </section>

    <section class="orders-table-wrap">
        <table class="orders-table">
            <thead>
            <tr>
                <th>
                    <button type="button" class="table-sort" data-sort="id">
                        ID <span class="sort-indicator" data-indicator="id"></span>
                    </button>
                </th>
                <th>
                    <button type="button" class="table-sort" data-sort="product_id">
                        Product <span class="sort-indicator" data-indicator="product_id"></span>
                    </button>
                </th>
                <th>
                    <button type="button" class="table-sort" data-sort="amount">
                        Amount <span class="sort-indicator" data-indicator="amount"></span>
                    </button>
                </th>
                <th>
                    <button type="button" class="table-sort" data-sort="status">
                        Status <span class="sort-indicator" data-indicator="status"></span>
                    </button>
                </th>
                <th>
                    <button type="button" class="table-sort" data-sort="fulfillment_status">
                        Fulfillment <span class="sort-indicator" data-indicator="fulfillment_status"></span>
                    </button>
                </th>
                <th>Payment Intent</th>
                <th>Fulfilled At</th>
                <th>Actions</th>
                <th>
                    <button type="button" class="table-sort" data-sort="created_at">
                        Created <span class="sort-indicator" data-indicator="created_at"></span>
                    </button>
                </th>
            </tr>
            </thead>
            <tbody id="orders-body"></tbody>
        </table>
    </section>

    <section class="order-detail-panel" id="order-detail-panel" hidden>
        <div class="order-detail-header">
            <div>
                <p class="status-eyebrow">Order detail</p>
                <h2 id="detail-title">Order</h2>
            </div>
            <button type="button" class="secondary-button" id="close-detail">Close</button>
        </div>

        <dl class="order-detail-grid" id="order-detail-grid"></dl>

        <div class="order-detail-actions">
            <button type="button" id="retry-fulfillment" disabled>
                Retry fulfillment
            </button>
        </div>
    </section>

    <div class="pagination-controls">
        <button type="button" id="previous-page" disabled>Previous</button>
        <span id="page-label">Page 1</span>
        <button type="button" id="next-page" disabled>Next</button>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        PayGate operator order view.
    </div>
</footer>

<script>
    let page = 1;
    let hasNext = false;
    let sortBy = "created_at";
    let sortDirection = "desc";
    let selectedOrderId = null;

    const apiKeyInput = document.getElementById("api-key");
    const statusFilter = document.getElementById("status-filter");
    const fulfillmentFilter = document.getElementById("fulfillment-filter");
    const productFilter = document.getElementById("product-filter");
    const ordersBody = document.getElementById("orders-body");
    const ordersSummary = document.getElementById("orders-summary");
    const pageLabel = document.getElementById("page-label");
    const previousButton = document.getElementById("previous-page");
    const nextButton = document.getElementById("next-page");
    const orderDetailPanel = document.getElementById("order-detail-panel");
    const detailTitle = document.getElementById("detail-title");
    const detailGrid = document.getElementById("order-detail-grid");
    const closeDetailButton = document.getElementById("close-detail");
    const retryFulfillmentButton = document.getElementById("retry-fulfillment");

    function appendDetail(label, value) {
        const term = document.createElement("dt");
        const description = document.createElement("dd");

        term.textContent = label;
        description.textContent = value || "";

        detailGrid.appendChild(term);
        detailGrid.appendChild(description);
    }

    function formatDate(value) {
        if (!value) {
            return "";
        }

        return new Date(value).toLocaleString();
    }

    function formatAmount(amount, currency) {
        return `${(amount / 100).toFixed(2)} ${currency}`;
    }

    function statusClass(value) {
        return `status-badge status-${value.replace("_", "-")}`;
    }

    function appendCell(row, value) {
        const cell = document.createElement("td");
        cell.textContent = value || "";
        row.appendChild(cell);
    }

    function appendStatusCell(row, value) {
        const cell = document.createElement("td");
        const badge = document.createElement("span");

        badge.className = statusClass(value);
        badge.textContent = value;

        cell.appendChild(badge);
        row.appendChild(cell);
    }

    function setEmptyState(message) {
        ordersSummary.textContent = message;
        ordersBody.textContent = "";
        previousButton.disabled = true;
        nextButton.disabled = true;
    }

    function updateSortIndicators() {
        document.querySelectorAll(".sort-indicator").forEach((indicator) => {
            if (indicator.dataset.indicator === sortBy) {
                indicator.textContent = sortDirection === "asc" ? "ASC" : "DESC";
                return;
            }

            indicator.textContent = "";
        });
    }

    async function loadOrderDetail(orderId) {
        const apiKey = apiKeyInput.value.trim();

        if (!apiKey) {
            setEmptyState("Enter the orders API key.");
            return;
        }

        const response = await fetch(`/orders/${orderId}`, {
            headers: {
                "X-API-Key": apiKey,
            },
        });

        if (response.status === 401) {
            setEmptyState("The API key is missing or invalid.");
            return;
        }

        if (response.status === 404) {
            setEmptyState("Order not found.");
            return;
        }

        if (!response.ok) {
            setEmptyState(`Could not load order detail. Status: ${response.status}`);
            return;
        }

        const order = await response.json();

        selectedOrderId = order.id;
        retryFulfillmentButton.disabled = !(
            order.status === "paid" &&
            ["pending", "failed", "payment_review"].includes(
                order.fulfillment_status
            )
        );

        detailTitle.textContent = `Order #${order.id}`;
        detailGrid.textContent = "";

        appendDetail("Product ID", order.product_id);
        appendDetail("Amount", formatAmount(order.amount, order.currency));
        appendDetail("Payment status", order.status);
        appendDetail("Fulfillment status", order.fulfillment_status);
        appendDetail("Stripe session", order.stripe_session_id);
        appendDetail("Payment intent", order.stripe_payment_intent);
        appendDetail("Fulfilled at", formatDate(order.fulfilled_at));
        appendDetail("Created at", formatDate(order.created_at));

        orderDetailPanel.hidden = false;
    }

    async function retryFulfillment() {
        const apiKey = apiKeyInput.value.trim();

        if (!apiKey || selectedOrderId === null) {
            setEmptyState("Select an order and enter the orders API key.");
            return;
        }

        const response = await fetch(
            `/orders/${selectedOrderId}/retry-fulfillment`,
            {
                method: "POST",
                headers: {
                    "X-API-Key": apiKey,
                },
            }
        );

        if (response.status === 401) {
            setEmptyState("The API key is missing or invalid.");
            return;
        }

        if (!response.ok) {
            setEmptyState(`Could not retry fulfillment. Status: ${response.status}`);
            return;
        }

        ordersSummary.textContent =
            `Fulfillment retry queued for order ${selectedOrderId}.`;

        await loadOrderDetail(selectedOrderId);
        await loadOrders();
    }

    async function loadOrders() {
        const apiKey = apiKeyInput.value.trim();

        if (!apiKey) {
            setEmptyState("Enter the orders API key.");
            return;
        }

        const params = new URLSearchParams({
            page: page.toString(),
            page_size: "10",
            include_total: "false",
        });

        params.set("sort_by", sortBy);
        params.set("sort_direction", sortDirection);

        if (statusFilter.value) {
            params.set("status", statusFilter.value);
        }

        if (fulfillmentFilter.value) {
            params.set("fulfillment_status", fulfillmentFilter.value);
        }

        if (productFilter.value.trim()) {
            params.set("product_id", productFilter.value.trim());
        }

        try {
            const response = await fetch(`/orders?${params.toString()}`, {
                headers: {
                    "X-API-Key": apiKey,
                },
            });

            if (response.status === 401) {
                setEmptyState("The API key is missing or invalid.");
                return;
            }

            if (!response.ok) {
                setEmptyState(`Could not load orders. Status: ${response.status}`);
                return;
            }

            const data = await response.json();

            hasNext = data.has_next;
            page = data.page;

            ordersSummary.textContent =
                `${data.items.length} orders shown. Showing page ${data.page}.`;

            if (data.total_pages > 0) {
                pageLabel.textContent = `Page ${data.page} of ${data.total_pages}`;
            } else {
                pageLabel.textContent = `Page ${data.page}`;
            }

            updateSortIndicators();
            previousButton.disabled = !data.has_previous;
            nextButton.disabled = !data.has_next;

            ordersBody.textContent = "";

            for (const order of data.items) {
                const row = document.createElement("tr");

                appendCell(row, String(order.id));
                appendCell(row, order.product_id);
                appendCell(row, formatAmount(order.amount, order.currency));
                appendStatusCell(row, order.status);
                appendStatusCell(row, order.fulfillment_status);
                appendCell(row, order.stripe_payment_intent);
                appendCell(row, formatDate(order.fulfilled_at));

                const actionCell = document.createElement("td");
                const viewButton = document.createElement("button");

                viewButton.type = "button";
                viewButton.className = "table-action";
                viewButton.textContent = "View";
                viewButton.addEventListener("click", () => {
                    loadOrderDetail(order.id);
                });

                actionCell.appendChild(viewButton);
                row.appendChild(actionCell);

                appendCell(row, formatDate(order.created_at));

                ordersBody.appendChild(row);
            }
        } catch (error) {
            console.error(error);
            setEmptyState("Could not connect to the orders API.");
        }
    }

    closeDetailButton.addEventListener("click", () => {
        orderDetailPanel.hidden = true;
    });

    retryFulfillmentButton.addEventListener("click", () => {
        retryFulfillment();
    });

    document.getElementById("needs-attention-failed").addEventListener("click", () => {
        page = 1;
        statusFilter.value = "paid";
        fulfillmentFilter.value = "failed";
        productFilter.value = "";
        loadOrders();
    });

    document.getElementById("needs-attention-review").addEventListener("click", () => {
        page = 1;
        statusFilter.value = "paid";
        fulfillmentFilter.value = "payment_review";
        productFilter.value = "";
        loadOrders();
    });

    document.getElementById("load-orders").addEventListener("click", () => {
        page = 1;
        loadOrders();
    });

    previousButton.addEventListener("click", () => {
        if (page > 1) {
            page -= 1;
            loadOrders();
        }
    });

    nextButton.addEventListener("click", () => {
        if (hasNext) {
            page += 1;
            loadOrders();
        }
    });

    statusFilter.addEventListener("change", () => {
        page = 1;
    });

    fulfillmentFilter.addEventListener("change", () => {
        page = 1;
    });

    productFilter.addEventListener("input", () => {
        page = 1;
    });

    document.querySelectorAll(".table-sort").forEach((button) => {
        button.addEventListener("click", () => {
            const nextSort = button.dataset.sort;

            if (sortBy === nextSort) {
                sortDirection = sortDirection === "asc" ? "desc" : "asc";
            } else {
                sortBy = nextSort;
                sortDirection = "desc";
            }

            page = 1;
            loadOrders();
        });
    });

    updateSortIndicators();
</script>
</body>
</html>
